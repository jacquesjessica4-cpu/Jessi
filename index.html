<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bibliothèque en Ligne - Démo</title>
  <meta name="description" content="Démo statique de la Bibliothèque en Ligne (version PHP/MySQL dans le dépôt).">
  <style>
/* assets/style.css
   Écoconception : aucune police ni bibliothèque externe chargée
   (polices système uniquement), pas d'image lourde, CSS unique et léger. */

:root{
  --bg:#f4f5f7;
  --panel:#ffffff;
  --text:#1a1f2b;
  --muted:#6b7280;
  --border:#e2e5ea;
  --navy:#0d1b2a;
  --navy-2:#14283c;
  --gold:#d4af37;
  --ok-bg:#e8f5e9; --ok-text:#1b5e20; --ok-border:#a5d6a7;
  --err-bg:#fdecea; --err-text:#b00020; --err-border:#f5b5ac;
  --radius:10px;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

a{ color: var(--navy-2); }

/* ---------- Barre de navigation ---------- */
.nav{
  background: var(--navy);
  color: #fff;
  padding: 14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.nav .brand{
  font-weight: 700;
  font-size: 1.15rem;
  display:flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  color: #fff;
}
.nav .brand .logo{ color: var(--gold); }
.nav .liens{ display:flex; gap: 6px; flex-wrap: wrap; }
.nav .liens a{
  color: #eef2f6;
  text-decoration:none;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.92rem;
}
.nav .liens a:hover{ background: rgba(212,175,55,0.18); }
.nav .lecteur{ font-size: 0.85rem; color: #cbd5e1; }
.nav .lecteur a{ color: var(--gold); }

/* ---------- Structure générale ---------- */
.container{
  max-width: 960px;
  margin: 28px auto;
  padding: 0 16px;
}

.hero{
  background: linear-gradient(150deg, var(--navy-2), var(--navy));
  color: #eef2f6;
  border-radius: var(--radius);
  padding: 28px 24px;
  margin-bottom: 22px;
}
.hero h1{ margin:0 0 8px; font-size: 1.6rem; }
.hero p{ margin:0; color:#c7d0dd; max-width: 60ch; }

h1{ font-size: 1.4rem; color: var(--navy-2); }
h2{ font-size: 1.15rem; color: var(--navy-2); margin-top: 26px; }

.hint{ color: var(--muted); font-size: 0.9rem; }

/* ---------- Formulaires ---------- */
label{ display:block; margin: 12px 0 6px; font-weight: 600; }
input[type="text"], input[type="search"], input[type="email"], input[type="number"],
input:not([type]), textarea, select{
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 1rem;
  background: var(--panel);
}
textarea{ min-height: 100px; resize: vertical; }

.recherche{
  display:flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.recherche input{ flex:1; min-width: 220px; }

.btn{
  display:inline-block;
  padding: 9px 16px;
  border:0;
  border-radius: var(--radius);
  background: var(--gold);
  color:#241c04;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  font-size: 0.95rem;
}
.btn:hover{ filter: brightness(1.05); }
.btn.secondary{ background: transparent; color: var(--navy-2); border: 1px solid var(--border); }
.btn.secondary:hover{ background: #eef1f5; }
.btn.danger{ background: #b00020; color: #fff; }
.btn[disabled]{ opacity: .55; cursor: not-allowed; }

/* ---------- Alertes ---------- */
.alert{ padding: 10px 14px; border-radius: var(--radius); margin: 14px 0; border: 1px solid transparent; }
.alert.ok{ background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
.alert.error{ background: var(--err-bg); color: var(--err-text); border-color: var(--err-border); }

/* ---------- Cartes livres (grille responsive) ---------- */
.grille-livres{
  display:grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  margin: 18px 0;
}
.carte-livre{
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display:flex;
  flex-direction:column;
  gap: 6px;
}
.carte-livre h3{ margin:0; font-size: 1.05rem; color: var(--navy-2); }
.carte-livre .auteur{ color: var(--muted); font-size: 0.9rem; }
.carte-livre .dispo{ font-size: 0.82rem; font-weight: 600; }
.carte-livre .dispo.oui{ color: var(--ok-text); }
.carte-livre .dispo.non{ color: var(--err-text); }
.carte-livre .actions{ margin-top: auto; display:flex; gap:8px; flex-wrap:wrap; }

/* ---------- Tableau (gestion des livres) ---------- */
table{ border-collapse: collapse; width: 100%; margin: 14px 0; background: var(--panel); }
th, td{ border: 1px solid var(--border); padding: 8px 10px; text-align: left; font-size: 0.92rem; }
th{ background: var(--navy-2); color: #fff; }

/* ---------- Fiche détail ---------- */
.fiche{
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.fiche dl{ display:grid; grid-template-columns: 160px 1fr; gap: 8px 14px; margin: 14px 0; }
.fiche dt{ font-weight: 600; color: var(--muted); }
.fiche dd{ margin:0; }

small{ display:block; margin-top: 4px; }

.footer{ text-align:center; color: var(--muted); font-size: 0.85rem; padding: 24px 16px; }

/* ---------- Responsive ---------- */
@media (max-width: 600px){
  .fiche dl{ grid-template-columns: 1fr; }
  .nav{ flex-direction: column; align-items: flex-start; }
}

/* ---------- Respect des préférences de mouvement réduit ---------- */
@media (prefers-reduced-motion: reduce){
  *{ transition: none !important; }
}

</style>
</head>
<body>
<nav class="nav">
  <a class="brand" href="#/"><span class="logo">◆</span> Bibliothèque en Ligne</a>
  <div class="liens">
    <a href="#/">Accueil</a>
    <a href="#/wishlist">Ma liste de lecture</a>
  </div>
  <div class="lecteur" id="lecteur"></div>
</nav>
<div class="container">
  <div class="alert ok" style="margin-top:16px">
    Démo statique pour GitHub Pages : les données sont enregistrées dans votre navigateur.
    L'application complète (PHP + MySQL, gestion CRUD des livres) se trouve dans les fichiers <code>.php</code> du dépôt.
  </div>
  <div id="app"></div>
</div>
<div class="footer">Bibliothèque en Ligne — Projet final, Développement Web</div>

<script>
const LIVRES = [
 {id:1,titre:"Le Petit Prince",auteur:"Antoine de Saint-Exupéry",description:"Un aviateur en panne dans le désert rencontre un petit garçon venu d'une autre planète.",maison:"Gallimard",n:4},
 {id:2,titre:"Vingt mille lieues sous les mers",auteur:"Jules Verne",description:"Les aventures du capitaine Nemo à bord du Nautilus.",maison:"Hetzel",n:2},
 {id:3,titre:"Fondation",auteur:"Isaac Asimov",description:"Le début de la saga qui imagine l'effondrement puis la renaissance d'un empire galactique.",maison:"Gnome Press",n:3},
 {id:4,titre:"Notre-Dame de Paris",auteur:"Victor Hugo",description:"L'histoire d'Esmeralda et de Quasimodo dans le Paris du Moyen Âge.",maison:"Gosselin",n:0},
 {id:5,titre:"L'Étranger",auteur:"Albert Camus",description:"Meursault, un homme indifférent, face à l'absurdité de l'existence.",maison:"Gallimard",n:5},
 {id:6,titre:"Une brève histoire du temps",auteur:"Stephen Hawking",description:"Une introduction accessible à la cosmologie moderne.",maison:"Bantam Books",n:1},
 {id:7,titre:"Les Misérables",auteur:"Victor Hugo",description:"Le parcours de Jean Valjean dans la France du XIXe siècle.",maison:"A. Lacroix",n:2},
 {id:8,titre:"La Ferme des animaux",auteur:"George Orwell",description:"Une fable politique où des animaux prennent le contrôle de leur ferme.",maison:"Secker & Warburg",n:0}
];
const $app = document.getElementById('app');
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(_) { return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_) {} }
let mem = {flash:null};
const stock = () => load('stock', {});
const dispo = l => (stock()[l.id] ?? l.n);
const lecteur = () => load('lecteur', null);
const liste = () => { const l = lecteur(); return l ? (load('listes', {})[l.email] || []) : []; };

function card(l){
  const d = dispo(l);
  return `<div class="carte-livre"><h3>${e(l.titre)}</h3><div class="auteur">par ${e(l.auteur)}</div>
  <div class="dispo ${d>0?'oui':'non'}">${d>0?d+' exemplaire(s) disponible(s)':'Aucun exemplaire disponible'}</div>
  <div class="actions"><a class="btn" href="#/livre/${l.id}">Voir les détails</a></div></div>`;
}
const searchForm = q => `<form class="recherche" id="sf" role="search"><input type="search" name="q" value="${e(q)}" placeholder="Titre ou nom d'auteur..." aria-label="Recherche"><button class="btn" type="submit">Rechercher</button></form>`;
function flash(){ const f = mem.flash; mem.flash = null; return f ? `<div class="alert ${f.t}">${e(f.m)}</div>` : ''; }

function home(){
  $app.innerHTML = flash() + `<div class="hero"><h1>Bienvenue à la Bibliothèque en Ligne</h1>
  <p>Notre catalogue compte actuellement <strong>${LIVRES.length}</strong> livre(s). Recherchez un titre ou un auteur, consultez la fiche d'un livre, puis ajoutez-le à votre liste de lecture.</p></div>
  ${searchForm('')}<h2>Tous les livres</h2><div class="grille-livres">${LIVRES.map(card).join('')}</div>`;
}
function results(q){
  const r = q ? LIVRES.filter(l => norm(l.titre).includes(norm(q)) || norm(l.auteur).includes(norm(q))) : [];
  $app.innerHTML = `<h1>Résultats de recherche</h1>${searchForm(q)}` +
    (!q ? `<p class="hint">Saisissez un titre ou un nom d'auteur.</p>` :
     !r.length ? `<p class="hint">Aucun livre ne correspond à « ${e(q)} ».</p>` :
     `<p class="hint">${r.length} résultat(s) pour « ${e(q)} ».</p><div class="grille-livres">${r.map(card).join('')}</div>`) +
    `<p><a class="btn secondary" href="#/">← Retour à l'accueil</a></p>`;
}
function details(id){
  const l = LIVRES.find(x => x.id === id);
  if (!l){ mem.flash = {t:'error', m:'Livre introuvable.'}; location.hash = '#/'; return; }
  const d = dispo(l), me = lecteur(), deja = liste().includes(l.id);
  let action = deja ? `<p class="alert ok">Ce livre est déjà dans votre liste de lecture.</p>`
    : !me ? `<p class="hint"><a href="#/identification?retour=livre/${l.id}">Identifiez-vous</a> pour ajouter ce livre à votre liste de lecture.</p>`
    : `<button class="btn" id="add" ${d<=0?'disabled':''}>Ajouter à ma liste de lecture</button>`;
  $app.innerHTML = flash() + `<h1>${e(l.titre)}</h1><div class="fiche"><dl>
   <dt>Auteur</dt><dd>${e(l.auteur)}</dd><dt>Maison d'édition</dt><dd>${e(l.maison)}</dd>
   <dt>Exemplaires disponibles</dt><dd class="dispo ${d>0?'oui':'non'}">${d>0?d+' disponible(s)':'Aucun exemplaire disponible'}</dd>
   <dt>Description</dt><dd>${e(l.description)}</dd></dl>${action}</div>
   <p><a class="btn secondary" href="#/">← Retour</a></p>`;
  const b = document.getElementById('add');
  if (b) b.onclick = () => {
    if (dispo(l) <= 0) return;
    const ls = load('listes', {}); ls[me.email] = [...(ls[me.email]||[]), l.id]; save('listes', ls);
    const st = stock(); st[l.id] = dispo(l) - 1; save('stock', st);
    mem.flash = {t:'ok', m:'Livre ajouté à votre liste de lecture.'}; details(id);
  };
}
function wishlist(){
  const me = lecteur();
  if (!me){ $app.innerHTML = `<h1>Ma liste de lecture</h1><p class="hint"><a href="#/identification?retour=wishlist">Identifiez-vous</a> pour voir votre liste.</p>`; return; }
  const items = liste().map(id => LIVRES.find(l => l.id === id)).filter(Boolean);
  $app.innerHTML = `<h1>Liste de lecture de ${e(me.prenom)} ${e(me.nom)}</h1>` +
   (items.length ? `<div class="grille-livres">${items.map(card).join('')}</div>` : `<p class="hint">Votre liste est vide.</p>`);
}
function ident(retour){
  const me = lecteur();
  $app.innerHTML = `<h1>Identification lecteur</h1><p class="hint">Aucun mot de passe : indiquez nom, prénom et email.</p>
  ${me?`<p class="alert ok">Actuellement identifié·e comme ${e(me.prenom)} ${e(me.nom)} (${e(me.email)}).</p>`:''}
  <form class="form-lecteur" id="idf"><label>Nom</label><input name="nom" required><label>Prénom</label><input name="prenom" required>
  <label>Email</label><input type="email" name="email" required><button class="btn" type="submit">Valider</button> <a class="btn secondary" href="#/">Retour</a></form>`;
  document.getElementById('idf').onsubmit = ev => {
    ev.preventDefault(); const f = new FormData(ev.target);
    save('lecteur', {nom:f.get('nom').trim(), prenom:f.get('prenom').trim(), email:f.get('email').trim().toLowerCase()});
    mem.flash = {t:'ok', m:'Vous êtes identifié·e comme ' + f.get('prenom').trim() + '.'};
    location.hash = '#/' + (retour || '');
  };
}
function nav(){
  const me = lecteur();
  document.getElementById('lecteur').innerHTML = me ? `Identifié·e comme <strong>${e(me.prenom)}</strong> — <a href="#/identification">changer</a>` : `<a href="#/identification">S'identifier comme lecteur</a>`;
}
function route(){
  const [path, qs=''] = location.hash.replace(/^#\/?/, '').split('?');
  const p = new URLSearchParams(qs); nav();
  if (path.startsWith('livre/')) details(parseInt(path.slice(6),10));
  else if (path === 'resultats') results(p.get('q') || '');
  else if (path === 'wishlist') wishlist();
  else if (path === 'identification') ident(p.get('retour'));
  else home();
  window.scrollTo(0,0);
}
document.addEventListener('submit', ev => {
  if (ev.target.id === 'sf'){ ev.preventDefault(); location.hash = '#/resultats?q=' + encodeURIComponent(new FormData(ev.target).get('q')); }
});
window.addEventListener('hashchange', route); route();
</script>
</body>
</html>
